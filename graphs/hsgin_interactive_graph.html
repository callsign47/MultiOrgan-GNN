<!DOCTYPE html>
<html>
<head>
    <title>HSGIN Heterogeneous Graph Visualizer</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #0f172a;
            color: #f8fafc;
        }
        #header {
            margin-bottom: 15px;
            text-align: center;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 24px;
            color: #38bdf8;
        }
        p {
            margin: 0;
            color: #94a3b8;
            font-size: 14px;
        }
        #mynetwork {
            width: 100%;
            height: 600px;
            border: 1px solid #334155;
            border-radius: 12px;
            background-color: #1e293b;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .legend {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
            font-size: 13px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>HSGIN 3-Organ Heterogeneous Patient Graph</h1>
        <p>Patient UID: <b>P_000001</b> | Target FIB-4 Score = <b>0.6646</b> (Drag nodes to inspect interaction topology)</p>
    </div>

    <div id="mynetwork"></div>

    <div class="legend">
        <div class="legend-item"><div class="dot" style="background: #1f77b4;"></div> Patient Node</div>
        <div class="legend-item"><div class="dot" style="background: #2ca02c;"></div> Liver Domain (6 features)</div>
        <div class="legend-item"><div class="dot" style="background: #ff7f0e;"></div> Kidney Domain (6 features)</div>
        <div class="legend-item"><div class="dot" style="background: #d62728;"></div> Heart Domain (8 features)</div>
        <div class="legend-item"><div class="dot" style="background: #9467bd;"></div> Biomarker Domain (4 features)</div>
    </div>

    <script type="text/javascript">
        var nodes = new vis.DataSet([{"id": "patient", "label": "PATIENT (P_000001)", "color": "#1f77b4", "size": 35, "title": "<b>PATIENT (P_000001)</b><br>Gender: 1, Target FIB-4: 0.6646"}, {"id": "liver", "label": "LIVER NODE", "color": "#2ca02c", "size": 28, "title": "<b>LIVER NODE</b><br>Features (6): GGT, Albumin, Bilirubin, ALP, FibroScan Median, CAP"}, {"id": "kidney", "label": "KIDNEY NODE", "color": "#ff7f0e", "size": 28, "title": "<b>KIDNEY NODE</b><br>Features (6): Creatinine, BUN, Uric Acid, Urine Albumin, Urine Creatinine, Kidney Disease History"}, {"id": "heart", "label": "HEART / CARDIO NODE", "color": "#d62728", "size": 28, "title": "<b>HEART / CARDIO NODE</b><br>Features (8): Systolic BP, Diastolic BP, Pulse, HDL, Total Chol, Hypertension, CHD, Heart Attack"}, {"id": "biomarker", "label": "BIOMARKER NODE", "color": "#9467bd", "size": 28, "title": "<b>BIOMARKER NODE</b><br>Features (4): WBC, RBC, Hemoglobin, hs-CRP"}]);
        var edges = new vis.DataSet([{"from": "patient", "to": "liver", "label": "pertains_to", "color": {"color": "#666666"}, "arrows": "to;from"}, {"from": "patient", "to": "kidney", "label": "pertains_to", "color": {"color": "#666666"}, "arrows": "to;from"}, {"from": "patient", "to": "heart", "label": "pertains_to", "color": {"color": "#666666"}, "arrows": "to;from"}, {"from": "patient", "to": "biomarker", "label": "pertains_to", "color": {"color": "#666666"}, "arrows": "to;from"}, {"from": "liver", "to": "kidney", "label": "interacts_with", "color": {"color": "#e74c3c"}, "dashes": true, "arrows": "to;from"}, {"from": "liver", "to": "heart", "label": "interacts_with", "color": {"color": "#e74c3c"}, "dashes": true, "arrows": "to;from"}, {"from": "kidney", "to": "heart", "label": "interacts_with", "color": {"color": "#e74c3c"}, "dashes": true, "arrows": "to;from"}]);

        var container = document.getElementById('mynetwork');
        var data = { nodes: nodes, edges: edges };
        var options = {
            nodes: {
                shape: 'dot',
                font: { size: 14, color: '#ffffff', face: 'Segoe UI' },
                borderWidth: 2,
                shadow: true
            },
            edges: {
                width: 2,
                font: { size: 11, align: 'top', color: '#94a3b8' },
                smooth: { type: 'curvedCW', roundness: 0.2 }
            },
            physics: {
                barnesHut: {
                    gravitationalConstant: -3000,
                    centralGravity: 0.3,
                    springLength: 150,
                    springConstant: 0.04
                }
            },
            interaction: {
                hover: true,
                tooltipDelay: 100
            }
        };
        var network = new vis.Network(container, data, options);
    </script>
</body>
</html>
